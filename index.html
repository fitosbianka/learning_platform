<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Persönliche Lernplattform für den Zahnmedizin Grundkurs. Drei Wochen, 21 Lektionen mit Tests, Glossar und Spickzetteln."
    />
    <meta name="theme-color" content="#2a7f7a" />
    <title>Zahnmedizin Grundkurs</title>
    <script>
      // Applies the theme before the first paint to avoid a flash.
      // Keep the storage key in sync with src/storage/storage.ts.
      (function () {
        var theme = null;
        try {
          var raw = localStorage.getItem('zahnkurs.store.v1');
          if (raw) theme = JSON.parse(raw).theme || null;
        } catch (e) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          try {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) {
            theme = 'light';
          }
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
